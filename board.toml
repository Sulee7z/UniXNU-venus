schema_version = 2

[board]
name = "venus"
soc = "SM8350"
soc_source = "sm8350"
os_profile = "ipados-17.7.11-21H461"
kit = "venus"
description = "Xiaomi Mi 11 M2011K2C: single-CPU platform bring-up"

[package]
unixnu = "../UniXNU"

[package.defconfig]
"ipados-17.7.11-21H461" = "venus_ufs_root_defconfig"

[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "GopFramebuffer", "AppleKeyStoreState", "ShengHidInput", "XnuPrelink", "DarwinBoot"]

[kernel]
# The default now matches the full root build used on the phone. Earlier
# entry/register-only configurations remain explicitly selectable in configs/.
defconfig = "venus_ufs_root_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8350.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "device:patches/xnu/profile-prerequisites.series", "os:patches/xnu/series", "device:patches/xnu/series"]
# Patch changes recreate xnu-work while compile records remain. Restore the
# matching omitted Apple headers before archive builders consume that source.
archives = [
  "prepare-xnu-source.py",
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  "build-mockfs-fixture.py",
  "build-libpthread-kernel.py",
  "build-venus-platform-power.py",
  "link-venus-ufs-survey.py",
  "build-venus-a660.py",
  "component:AppleKeyStoreState",
  "component:ShengHidInput",
  "build-gop-legacy-display.py",
]

# Selected deployment layout: separate 64 GiB unixnu partition; Android userdata
# was reinitialized; post-reset fastboot sizes matched before the authorized root flash.
[userdata]
partition = "unixnu"
geometry_verified = true
first_lba = 44881664
last_lba = 61658879
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[device_tree]
source = "device:dts/venus.dts"
include_dirs = ["soc:dts", "device:dts"]

[firmware]
config = "venus"
dsc = "Platforms/Xiaomi/venusPkg/venus.dsc"
fd = "Build/venusPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
packages = ["{uefi}", "{uefi}/Platforms/Xiaomi", "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample", "{edk2}", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium", "{uefi}/Silicium-ACPI", "{uefi}/Silicium-ACPI/Platforms/Xiaomi", "{uefi}/Silicium-ACPI/Silicon/Qualcomm", "{tree}/package", "{tree}/drivers/DarwinBoot"]
patches = ["Resources/MuPatches/AsmMacroLib.patch", "Resources/MuPatches/Auth-Service.patch", "Resources/MuPatches/Boot-Manager.patch", "Resources/MuPatches/Timer.patch", "Resources/MuPatches/Usb-Bus.patch", "Resources/MuPatches/Venus-PoolDiagnostics.patch"]

[firmware.defines]
DEVICE_MODEL = "0"
ENABLE_SECUREBOOT = "0"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "UniXNU-venus"
VENUS_GUIDE_LOGGING = "TRUE"

[bootimg.image]
header_version = 3
pagesize = 4096

[payload]
volume = "VENUSXNU"
# The physical boot partition is 192 MiB; leave room for shim/FD/header.
size_mib = 160
loader = "firmware"
title = "Mi 11 XNU platform bring-up"
timeout = 5
tools = true
panic_screen = true
kernel_args = ["-v", "serial=3", "cpus=1", "debug=0x14e", "-no_slto_panic", "sheng-pmgr=2",
  "native-ufs-root=1", "native-ufs-probe=0", "sheng-data-persist=2", "sheng-log-reserve=1024", "offline-apfs-load=1",
  "-apfs_shared_datavolume", "boot-progress=2",
  "offline-legacy-register=1", "offline-legacy-gop=1", "offline-legacy-unit-scale=2",
  "offline-legacy-pm=1", "offline-legacy-validate=1", "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1", "offline-legacy-phase=4",
  "offline-mobile-graphics-client=1", "offline-mobile-graphics-load=1",
  "offline-key-events=1", "sheng-aks=1", "offline-hid-input=1", "offline-hid-home=1",
  "sheng-vsync=120", "sheng-fb-gpu=0", "sheng-early-retire=1", "sheng-backlight=0",
  "sheng-dpu=0", "sheng-touch=0", "sheng-gpu-power=0", "sheng-gpu-metal=0",
  "sheng-banner=0", "sheng-lite=1"]

[payload.adt]
chip_id = "8350"
unique_chip_id = "required"
# Current venus.dsc enables UNIXNU_VENUS_HIGH_MEMORY and publishes Kernel RAM G.
# 1 GiB is the repeatedly phone-tested owned window, independent of the DRAM
# bank extent in hardware DTS. See evidence/highmem-1g-phone.json.
owned_memory_size = "0x40000000"
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
packed_data_ramdisk = true
persistent_data = true

[adt.product.string]
# Software board identity of the selected iPad7,1 / J120 OS profile.
model = "J120AP"
artwork-display-gamut = "sRGB"

[adt.product.u32]
thin-bezel = 1

[adt.chosen.u32]
# MGGetFloat32Answer(main-screen-scale) reads this before constructing the
# SpringBoard mode. Publish it in the boot ADT, not just the late GOP callback.
display-scale = 2
display-rotation = 0

[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2

[adt.defaults.u32]
sleep-disabled = 1
