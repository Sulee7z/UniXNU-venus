schema_version = 2

[board]
name = "venus"
soc = "SM8350"
soc_source = "sm8350"
os_profile = "ios-26.5.2-23F84-zeta-arm64"
kit = "venus"
description = "Xiaomi Mi 11 M2011K2C: ordinary ARM64 iOS26 source-rebuilt 066 bring-up"

[package]
unixnu = ".cache/UniXNU"
boot_partition_bytes = 201326592

[package.defconfig]
"ios-26.5.2-23F84-zeta-arm64" = "venus_066_defconfig"

[components]
include = ["ArmDTPlatform", "ArmCpu", "DarwinBoot"]

[kernel]
# The hash-locked closure contains the applied source changes and generated
# public headers. Its aggregate recipe builds every selected native archive.
defconfig = "venus_066_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8350.config", "os:configs/native.config"]
patch_series = ["device:patches/repro/series"]
archives = []

[kernel.prelink]
# Device-specific KDK25F84 provider conversion, not the classic IPSW backend.
tool = "scripts/prelink-repro-kernel.py"
kernel = "build/native/kernel.native.macho"
kernelcache_sha256 = "8866c7241744e4e1d8513b4fbeb1a3f8f2179fe731b31994e8fe9b12b9097906"
slide = "-0x1000000"
roots = ["com.apple.filesystems.apfs", "com.apple.driver.AppleMobileFileIntegrity", "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib", "com.apple.security.sandbox", "com.apple.iokit.IOSurface", "com.apple.iokit.IOMobileGraphicsFamily", "com.apple.iokit.IOHIDFamily"]
extra_args = ["--repro-config", "kits/venus/repro-inputs.toml"]

# Selected deployment layout: separate 64 GiB unixnu partition; Android userdata
# was reinitialized; post-reset fastboot sizes matched before the authorized root flash.
[userdata]
partition = "unixnu"
geometry_verified = true
first_lba = 44881664
last_lba = 61658879
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[device_tree]
source = "device:dts/venus.dts"
include_dirs = ["soc:dts", "device:dts"]

[firmware]
config = "venus"
dsc = "Platforms/Xiaomi/venusPkg/venus-unixnu-048.dsc"
fd = "Build/venusUniXNU048/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
packages = ["{uefi}", "{uefi}/Platforms/Xiaomi", "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample", "{edk2}", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium", "{uefi}/Silicium-ACPI", "{uefi}/Silicium-ACPI/Platforms/Xiaomi", "{uefi}/Silicium-ACPI/Silicon/Qualcomm", "{tree}/package", "{tree}/drivers/DarwinBoot"]
patches = ["Resources/MuPatches/Auth-Service.patch", "Resources/MuPatches/Boot-Manager.patch", "Resources/MuPatches/Timer.patch", "Resources/MuPatches/Usb-Bus.patch"]
preflight = ["prepare-repro-firmware.py"]
submodules = ["Binaries", "Common/Mu", "Common/Mu_OEM_Sample", "Mu_Basecore", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]

[firmware.defines]
DEVICE_MODEL = "0"
ENABLE_SECUREBOOT = "0"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "UniXNU-venus-diagnostic"

[bootimg.image]
header_version = 3
pagesize = 4096

[payload]
volume = "VENUSXNU"
# The physical boot partition is 192 MiB; leave room for shim/FD/header.
size_mib = 160
loader = "firmware"
title = "Mi 11 iOS26 066 source rebuild"
timeout = 5
tools = true
panic_screen = false # Already source-wired and sealed by the prelink recipe.
kernel_args = ["-v", "serial=3", "cpus=4", "debug=0x14e", "-no_slto_panic", "use_contiguous_hint=0", "native-ufs-root=1", "native-ufs-probe=0", "sheng-data-persist=1", "sheng-log-reserve=1024", "offline-apfs-load=1", "-apfs_shared_datavolume", "dyld_flags=0x8", "native-ufs-diagnostics=1", "keepsyms=1", "offline-mobile-graphics-load=1", "offline-legacy-register=1", "offline-legacy-gop=1", "offline-legacy-unit-scale=2", "offline-legacy-phase=4", "offline-legacy-pm=1", "offline-legacy-validate=1", "offline-legacy-transfer=1", "offline-legacy-cpu-present=1", "sheng-vsync=60", "offline-key-events=1", "sheng-aks=1", "offline-hid-input=1", "offline-hid-home=1", "sheng-lite=1", "sheng-disable-watchdogd=1", "sheng-setup=0", "kt_fixed_zones=120", "venus-systemos-view=1", "venus-sb-info=1", "venus-owner-manifest=1", "venus-first-ui=1", "sheng-smp=1", "armcpu-self-ipi=1", "armcpu-diagnostics=1", "sheng-disable-jobs=com.apple.fairplayd.H2", "venus-fbs-trace=1", "venus-sb-nil=1", "venus-st-touch=3", "venus-surface-import=1", "venus-amfi-probe=1"]

[payload.adt]
chip_id = "8350"
unique_chip_id = "required"
owned_memory_size = "0x140000000"
root_match_volume_uuid = "B6C635B2-67F6-4034-B5D5-539E4D03D1EC"
cpu_regs = "0,0x400,0x500,0x700"
psci_method = "smc"
packed_data_ramdisk = true
persistent_data = true

[adt.root.string]
model = "V54AP"
target-type = "V54"

[adt.product.string]
model = "V54AP"
artwork-display-gamut = "sRGB"

[adt.product.u32]
thin-bezel = 1

[adt.chosen.u32]
# MGGetFloat32Answer(main-screen-scale) reads this before constructing the
# SpringBoard mode. Publish it in the boot ADT, not just the late GOP callback.
display-scale = 2
display-rotation = 0

[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2

[adt.defaults.u32]
sleep-disabled = 1
